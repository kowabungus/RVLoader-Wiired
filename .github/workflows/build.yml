name: DOL

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: DevkitPPC build
    runs-on: ubuntu-latest
    container:
      # Pinned to an older toolchain snapshot; RVLoader predates newer libogc changes
      image: devkitpro/devkitppc:20240504

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Make
      run: |
        make clean
        make

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SD Card Files
        path: ./driveRoot/
