name: DOL

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: DevkitPPC build (official v2.1 + Wiired changes)
    runs-on: ubuntu-latest
    container:
      # Pinned to an older toolchain snapshot; RVLoader predates newer libogc changes
      image: devkitpro/devkitppc:20240504

    steps:
    # This fork: provides the modified files
    - name: Checkout fork (Wiired changes)
      uses: actions/checkout@v4
      with:
        path: wiired

    # Official RVLoader v2.1 release source
    - name: Checkout official RVLoader v2.1
      uses: actions/checkout@v4
      with:
        repository: Aurelio92/RVLoader
        ref: v2.1
        path: src

    - name: Apply Wiired changes to v2.1
      run: |
        for f in \
          main/source/luasupport/luasyslib.cpp \
          main/source/gui/guigamesview.cpp \
          driveRoot/rvloader/themes/main/scripts/topbar.lua \
          driveRoot/rvloader/themes/main/scripts/loaderSettings.lua \
          driveRoot/rvloader/themes/main/scripts/settings.lua
        do
          echo "Applying $f"
          cp -f "wiired/$f" "src/$f"
        done

    - name: Make
      working-directory: src
      run: |
        make clean
        make

    - name: Check boot.dol
      working-directory: src
      run: |
        ls -l driveRoot/apps/RVLoader/
        grep -q getHomeTarget driveRoot/apps/RVLoader/boot.dol && echo "boot.dol contains the Wiired changes" || (echo "ERROR: boot.dol was not rebuilt" && exit 1)

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SD Card Files
        path: ./src/driveRoot/
