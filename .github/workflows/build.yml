name: DOL

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: DevkitPPC build (official v2.1 + Wiired bridge)
    runs-on: ubuntu-latest
    container:
      # Pinned to an older toolchain snapshot; RVLoader predates newer libogc changes
      image: devkitpro/devkitppc:20240504

    steps:
    # This fork: provides the wiired-overlay folder
    - name: Checkout fork (Wiired changes)
      uses: actions/checkout@v4
      with:
        path: wiired

    # Official RVLoader v2.1 release source
    - name: Checkout official RVLoader v2.1
      uses: actions/checkout@v4
      with:
        repository: Aurelio92/RVLoader
        ref: v2.1
        path: src

    # Every file in wiired-overlay replaces (or adds) the file at the same path
    - name: Apply Wiired changes to v2.1
      run: |
        test -d wiired/wiired-overlay || (echo "ERROR: wiired-overlay folder missing from the fork" && exit 1)
        cp -rv wiired/wiired-overlay/. src/

    - name: Make
      working-directory: src
      run: |
        make clean
        make

    - name: Check boot.dol
      working-directory: src
      run: |
        ls -l driveRoot/apps/RVLoader/
        grep -q launchWiired driveRoot/apps/RVLoader/boot.dol && echo "boot.dol contains the Wiired bridge" || (echo "ERROR: boot.dol was not rebuilt" && exit 1)

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SD Card Files
        path: ./src/driveRoot/
